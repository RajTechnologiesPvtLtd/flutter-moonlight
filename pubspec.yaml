name: moonlight
description: "moonlight framework"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  http: ^1.5.0
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.0
  # storage
  shared_preferences: ^2.5.3
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.4
  firebase_remote_config: ^6.1.0
  # database
  hive_flutter: ^1.1.0
  sqflite: ^2.4.2
  # notification
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  # earning
  google_mobile_ads: ^6.0.0
  # UI
  youtube_player_flutter: ^9.1.3
  # localizations
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_gen: ^5.12.0
  geolocator: ^14.0.1
  # Framework / State Management
  provider: ^6.1.5+1
  get: ^4.7.2
  flutter_bloc: ^9.1.1
  sensors_plus: ^7.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true # Generate code with intl_translation
  assets:
    - assets/images/
    - assets/json/
